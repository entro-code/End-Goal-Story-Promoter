name: Queue Instagram stories

on:
  schedule:
    # Every 6 hours; each run queues only the next ~12 hours of stories,
    # so Buffer never holds more than a handful of scheduled posts.
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Find new uploads, plan and render the next stories
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python run.py prepare

      # Buffer can only fetch images from a public URL, so publish them first.
      - name: Publish rendered images
        run: |
          git config user.name "story-promoter"
          git config user.email "story-promoter@users.noreply.github.com"
          git add -A stories state docs episodes.json articles.json
          git commit -m "Update stories and episode list" || echo "nothing to commit"
          git push

      - name: Queue the stories in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python run.py queue

      - name: Save progress
        if: always()
        run: |
          git add -A state docs
          git commit -m "Record queued stories" || echo "nothing to commit"
          git push
