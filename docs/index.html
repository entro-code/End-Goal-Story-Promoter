<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>End Goal Podcast</title>
<meta name="description" content="Watch, listen or read the latest from the End Goal Podcast.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,800;125,900&family=Archivo:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0e0a; --card: #14210f; --card-edge: #2c4a22;
    --text: #fff; --muted: #c9d6c4; --green: #41752a; --green-hi: #5fa83e;
    --youtube: #ff2e2e; --spotify: #1ed760; --substack: #ff6719;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100vh; color: var(--text);
    font-family: "Archivo", system-ui, sans-serif;
    background:
      radial-gradient(120% 70% at 50% -10%, #41752a 0%, #264c1d 38%, #0c0e0a 78%) no-repeat,
      var(--bg);
    padding: 28px 16px calc(40px + env(safe-area-inset-bottom));
  }
  main { max-width: 460px; margin: 0 auto; }
  .brand { text-align: center; margin-bottom: 18px; }
  .brand h1 {
    font-stretch: 125%; font-weight: 900; font-size: 15px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }
  .hub {
    display: block; text-align: center; text-decoration: none; color: var(--text);
    border: 1.5px solid var(--card-edge); border-radius: 999px; padding: 14px 18px;
    font-stretch: 125%; font-weight: 900; text-transform: uppercase; letter-spacing: .06em;
    background: rgba(12,14,10,.45); margin-bottom: 22px;
  }
  .hub small { display:block; font-weight:500; font-stretch:100%; text-transform:none;
    letter-spacing:0; color: var(--muted); margin-top: 2px; font-size: 13px; }
  .label {
    font-stretch: 125%; font-weight: 900; font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--green-hi); margin: 0 4px 10px;
  }
  .now {
    background: var(--card); border: 1.5px solid var(--card-edge); border-radius: 22px;
    overflow: hidden; box-shadow: 0 14px 40px rgba(0,0,0,.45);
  }
  .now img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #0c0e0a; }
  .now .body { padding: 18px 18px 20px; }
  .now h2 {
    font-stretch: 112%; font-weight: 800; font-size: 21px; line-height: 1.18;
    text-transform: uppercase; margin-bottom: 16px;
  }
  .btns { display: grid; gap: 10px; }
  a.btn {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    text-decoration: none; color: var(--text); padding: 15px 18px; border-radius: 14px;
    font-stretch: 125%; font-weight: 900; font-size: 14px; letter-spacing: .05em;
    text-transform: uppercase; background: rgba(255,255,255,.07);
    border: 1.5px solid rgba(255,255,255,.14);
  }
  a.btn .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  a.btn.main { border-color: transparent; color: #0c0e0a; }
  a.btn.main[data-p="youtube"] { background: #fff; }
  a.btn.main[data-p="spotify"] { background: var(--spotify); }
  a.btn.main[data-p="substack"] { background: var(--substack); color: #fff; }
  a.btn .arrow { font-size: 18px; }
  .earlier { margin-top: 26px; }
  .row {
    display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center;
    text-decoration: none; color: var(--text); padding: 8px; border-radius: 14px;
  }
  .row + .row { margin-top: 4px; }
  .row img { width: 96px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background:#14210f; }
  .row span { font-weight: 700; font-size: 14px; line-height: 1.25; }
  .row small { display:block; color: var(--muted); font-weight: 500; margin-top: 3px; text-transform: capitalize; }
  .freebies { margin-top: 30px; }
  .free {
    display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center;
    text-decoration: none; color: var(--text); padding: 10px; border-radius: 18px;
    background: var(--card); border: 1.5px solid var(--card-edge);
  }
  .free + .free { margin-top: 10px; }
  .free img { width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; background: #fff; }
  .free b { display: block; font-stretch: 112%; font-weight: 800; font-size: 15px;
    line-height: 1.2; text-transform: uppercase; }
  .free small { display: block; margin-top: 5px; color: var(--green-hi); font-weight: 700;
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; opacity: .7; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <div class="brand"><h1>End Goal Podcast</h1></div>

  <a id="hub" class="hub hidden" href="#" rel="noopener"></a>

  <div class="label" id="nowLabel">Now showing</div>
  <section class="now" id="now" aria-live="polite">
    <div class="body"><h2>Loading…</h2></div>
  </section>

  <section class="earlier hidden" id="earlier">
    <div class="label">Earlier today</div>
    <div id="earlierList"></div>
  </section>

  <section class="freebies hidden" id="freebies">
    <div class="label">Freebies</div>
    <div id="freebiesList"></div>
  </section>

  <footer>New episodes every Monday</footer>
</main>

<script>
const NAMES = { youtube: "Watch on YouTube", spotify: "Listen on Spotify", substack: "Read on Substack" };
const ORDER = ["youtube", "spotify", "substack"];
const COLORS = { youtube: "var(--youtube)", spotify: "var(--spotify)", substack: "var(--substack)" };

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function card(item, platform) {
  const links = item.links || {};
  const keys = ORDER.filter(k => links[k]);
  if (platform && keys.includes(platform)) { keys.splice(keys.indexOf(platform), 1); keys.unshift(platform); }
  const btns = keys.map((k, i) =>
    `<a class="btn${i === 0 ? " main" : ""}" data-p="${k}" href="${esc(links[k])}" rel="noopener">
       <span>${NAMES[k]}</span><span class="arrow">→</span></a>`).join("");
  return `${item.thumb ? `<img src="${esc(item.thumb)}" alt="">` : ""}
    <div class="body"><h2>${esc(item.title)}</h2><div class="btns">${btns}</div></div>`;
}

function render(data) {
  if (data.hub_url) {
    const hub = document.getElementById("hub");
    hub.href = data.hub_url;
    hub.innerHTML = `Visit ${esc(data.hub_label || data.hub_url)}<small>Everything else, in one place</small>`;
    hub.classList.remove("hidden");
  }
  if ((data.freebies || []).length) {
    document.getElementById("freebiesList").innerHTML = data.freebies.map(f =>
      `<a class="free" href="${esc(f.url)}" rel="noopener">
         ${f.image ? `<img src="${esc(f.image)}" alt="" loading="lazy">` : "<div></div>"}
         <span><b>${esc(f.title)}</b><small>${esc(f.blurb || "Get it free")} →</small></span></a>`).join("");
    document.getElementById("freebies").classList.remove("hidden");
  }
  const now = Date.now();
  const live = (data.stories || []).filter(s => Date.parse(s.at) <= now);
  const current = live.length ? live[live.length - 1] : data.latest;
  const nowEl = document.getElementById("now");
  if (!current) { nowEl.innerHTML = '<div class="body"><h2>Check back soon</h2></div>'; return; }
  nowEl.innerHTML = card(current, current.platform);
  document.getElementById("nowLabel").textContent = live.length ? "Now showing" : "Latest episode";

  const seen = new Set([current.title]);
  const earlier = [];
  for (let i = live.length - 2; i >= 0 && earlier.length < 4; i--) {
    const s = live[i];
    if (seen.has(s.title)) continue;
    seen.add(s.title); earlier.push(s);
  }
  if (earlier.length) {
    document.getElementById("earlierList").innerHTML = earlier.map(s => {
      const href = (s.links || {})[s.platform] || Object.values(s.links || {})[0] || "#";
      return `<a class="row" href="${esc(href)}" rel="noopener">
        ${s.thumb ? `<img src="${esc(s.thumb)}" alt="" loading="lazy">` : "<div></div>"}
        <span>${esc(s.title)}<small>${esc(s.platform)}</small></span></a>`;
    }).join("");
    document.getElementById("earlier").classList.remove("hidden");
  }
}

fetch("schedule.json?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" })
  .then(r => r.json()).then(render)
  .catch(() => { document.getElementById("now").innerHTML = '<div class="body"><h2>Check back soon</h2></div>'; });
</script>
</body>
</html>
